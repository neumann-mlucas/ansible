---
- name: Upgrade uv tools
  ansible.builtin.command:
    cmd: uv tool upgrade --all
  become: false
  become_user: "{{ ansible_facts['user_id'] }}"
  changed_when: true
#
- name: Prune uv cache
  ansible.builtin.command:
    cmd: uv cache prune
  become: false
  become_user: "{{ ansible_facts['user_id'] }}"
  changed_when: true
