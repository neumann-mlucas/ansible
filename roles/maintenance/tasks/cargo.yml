---
# Some tools in ~/.cargo/bin come from `cargo install`, not pacman, so they need this upgrade.
- name: Upgrade cargo tools
  ansible.builtin.command:
    cmd: cargo install-update -a
  become: true
  become_user: "{{ username }}"
  changed_when: true
#
- name: Check cargo-sweep roots
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ cargo_sweep_roots }}"
  register: cargo_sweep_root_stat
#
# Per-worktree target/ dirs grow unbounded and filled / once (2026-11)
- name: Sweep stale Rust build artifacts
  ansible.builtin.command:
    cmd: cargo sweep --recursive --time {{ cargo_sweep_days }} {{ item.item }}
  become: true
  become_user: "{{ username }}"
  register: cargo_sweep_result
  changed_when: "'Total amount: 0.00 B' not in (cargo_sweep_result.stdout ~ cargo_sweep_result.stderr)"
  loop: "{{ cargo_sweep_root_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.isdir | default(false)
