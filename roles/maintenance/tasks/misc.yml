---
- name: Clean go cache
  ansible.builtin.command:
    cmd: go clean -cache
  become: true
  become_user: "{{ username }}"
  changed_when: true
  when: is_desktop
#
- name: Vacuum systemd journal
  ansible.builtin.command:
    cmd: journalctl --vacuum-time=30d
  become: true
  changed_when: true
#
- name: Refresh tealdeer cache
  ansible.builtin.command:
    cmd: tldr --update
  become: true
  become_user: "{{ username }}"
  changed_when: true
#
# Report only: some dangling links are intentional (Firefox profile lock, links tracked in repos).
- name: Find broken symlinks in stowed config dirs
  ansible.builtin.command:
    cmd: >-
      find /home/{{ username }}/.config /home/{{ username }}/.local/bin
      /home/{{ username }}/.claude /home/{{ username }}/.agents
      -path '*/mozilla' -prune -o -xtype l -print
  become: true
  become_user: "{{ username }}"
  register: broken_links
  changed_when: false
  failed_when: false
#
- name: Report broken symlinks
  ansible.builtin.debug:
    msg: "Broken symlinks (remove by hand): {{ broken_links.stdout_lines }}"
  when: broken_links.stdout | length > 0
