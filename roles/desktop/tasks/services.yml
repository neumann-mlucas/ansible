---
- name: Enable desktop services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    masked: false
  loop:
    - gdm.service
    - keyd.service
    - tlp.service
#
- name: Disable containerd
  ansible.builtin.systemd_service:
    name: containerd.service
    enabled: false
    state: stopped
  become: true
  failed_when: false
