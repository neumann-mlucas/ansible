---
- name: Create keyd config directory
  ansible.builtin.file:
    path: /etc/keyd
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
#
- name: Set keyd config
  ansible.builtin.copy:
    dest: /etc/keyd/default.conf
    content: |
      [ids]
      *

      [main]
      capslock = overload(meta, esc)
      insert = S-insert

      [alt]
      h = left
      j = down
      k = up
      l = right

      [meta]
      c = C-c
      v = C-v
    owner: root
    group: root
    mode: "0644"
  become: true
#
- name: Bind dictd to localhost
  ansible.builtin.lineinfile:
    path: /etc/default/dictd
    regexp: "^DICTD_ARGS="
    line: 'DICTD_ARGS="--locale C.utf8 --listen-to 127.0.0.1"'
  become: true
  notify: restart dictd
#
- name: Create docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
#
- name: Disable Docker iptables manipulation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "iptables": false
      }
    owner: root
    group: root
    mode: "0644"
  become: true
