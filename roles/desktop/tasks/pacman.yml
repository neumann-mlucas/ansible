---
- name: Install audio with pipewire
  community.general.pacman:
    name:
      - alsa-firmware
      - alsa-plugins
      - alsa-tools
      - pipewire-alsa
      - pipewire-audio
      - pipewire-jack
      - pipewire-pulse
      - pipewire-docs
      - sof-firmware
    state: present
#
- name: Install desktop environment
  community.general.pacman:
    name:
      - brightnessctl
      - cliphist
      - grim
      - hyprland
      - hyprpaper
      - hyprsunset
      - mako
      - network-manager-applet
      - playerctl
      - slurp
      - wayland
      - wl-clipboard
      - wofi
      - waybar
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-hyprland
    state: present
#
- name: Install pdf readers
  community.general.pacman:
    name:
      - pdftk
      - zathura
      - zathura-djvu
      - zathura-pdf-mupdf
    state: present
#
- name: Install image viewer
  community.general.pacman:
    name:
      - imv
    state: present
#
- name: Install TUI tools
  community.general.pacman:
    name:
      - ghostty
      - lazydocker
      - lazygit
      - yazi
    state: present
#
- name: Install more CLI tools
  community.general.pacman:
    name:
      - dictd
      - firefox
      - flite
      - keyd
      - ollama
      - restic
      - mpv
      - pnpm
      - surfraw
      - task
    state: present
#
- name: Install cloud/infra CLIs
  community.general.pacman:
    name:
      - argocd
      - aws-cli-v2
      - helm
    state: present
#
- name: Install extra language runtimes
  community.general.pacman:
    name:
      - luarocks
      - ruby
    state: present
#
- name: Install go toolchain
  community.general.pacman:
    name:
      - go
      - go-tools
      - gofumpt
      - golangci-lint
      - govulncheck
      - shfmt
    state: present
#
- name: Install rust toolchain
  community.general.pacman:
    name:
      - rust
    state: present
#
- name: Install julia toolchain
  community.general.pacman:
    name:
      - julia
    state: present
#
- name: Install kubernetes tools
  community.general.pacman:
    name:
      - k9s
      - kubectl
      - kubectx
    state: present
#
- name: Install fonts
  community.general.pacman:
    name:
      - ttf-fira-code
      - ttf-firacode-nerd
      - ttf-hack-nerd
      - ttf-iosevka-nerd
    state: present
#
- name: Install notebook stuff
  community.general.pacman:
    name:
      - tlp
    state: present
#
- name: Install python tools using uv
  ansible.builtin.command:
    cmd: uv tool install {{ item }}
  register: uv_install_result
  changed_when: "'Already installed' not in uv_install_result.stdout"
  become: true
  become_user: "{{ username }}"
  loop:
    - git-sim
    - radon
    - visidata
    - yt-dlp
