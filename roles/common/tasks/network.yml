---
- name: Force public key authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/20-force_publickey_auth.conf
    content: |
      PasswordAuthentication no
      AuthenticationMethods publickey
      Port 3141
      PermitRootLogin no
      AllowUsers {{ username }}
      MaxAuthTries 3
      LoginGraceTime 30
      KbdInteractiveAuthentication no
      AllowAgentForwarding no
      AllowTcpForwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/sshd -t -f %s
  become: true
  notify: reload sshd
#
- name: UFW set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow
#
- name: UFW set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny
#
- name: UFW allow SSH on port 3141 (LAN only)
  community.general.ufw:
    rule: limit
    port: "3141"
    proto: tcp
    src: "{{ lan_cidr }}"
  when: is_server
#
- name: UFW drop SSH rule open to anywhere
  community.general.ufw:
    rule: limit
    port: "3141"
    proto: tcp
    delete: true
#
- name: UFW enable Syncthing ports (LAN only)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ lan_cidr | default('192.168.15.0/24') }}"
  loop:
    - { port: "22000", proto: tcp }
    - { port: "22000", proto: udp }
    - { port: "21027", proto: udp }
#
- name: Enable UFW
  community.general.ufw:
    state: enabled
#
- name: Enable logging in UFW
  community.general.ufw:
    logging: true
#
- name: Create fail2ban config
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1
      bantime = 86400
      findtime = 600
      maxretry = 5
      [sshd]
      enabled = true
      backend = systemd
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart fail2ban
