---
- name: change shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /usr/bin/zsh
#
- name: Require password for wheel sudo
  ansible.builtin.replace:
    path: /etc/sudoers
    regexp: '^%wheel ALL=\(ALL:ALL\) NOPASSWD: ALL$'
    replace: "%wheel ALL=(ALL:ALL) ALL"
    validate: "visudo -cf %s"
  become: true
#
- name: Create docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: present
#
- name: Read docker group members
  ansible.builtin.getent:
    database: group
    key: docker
#
# docker group = passwordless root
- name: Remove user from docker group
  ansible.builtin.command: gpasswd -d {{ username }} docker
  become: true
  changed_when: true
  when: username in ansible_facts['getent_group']['docker'][2].split(',')
#
- name: Create docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
#
- name: Disable Docker iptables manipulation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "iptables": false
      }
    owner: root
    group: root
    mode: "0644"
  become: true
#
- name: Regenerate grub config
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: false
#
- name: Change pacman config
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  with_items:
    - { regexp: "^#Color$", replace: "Color" }
    - { regexp: "^#VerbosePkgLists$", replace: "VerbosePkgLists" }
    - { regexp: "^#ParallelDownloads = 5$", replace: "ParallelDownloads = 20" }
#
- name: Change journald max log size
  ansible.builtin.replace:
    path: /etc/systemd/journald.conf
    regexp: "^#SystemMaxUse=$"
    replace: "SystemMaxUse=512M"
#
- name: Optimize vm.swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/10-swappiness.conf
    content: |
      vm.swappiness = 180
      vm.watermark_boost_factor = 0
      vm.watermark_scale_factor = 125
      vm.page-cluster = 0
    owner: root
    group: root
    mode: "0644"
  become: true
#
# leftovers from old k8s/cilium setup; they force rp_filter=0 and ip_forward=1
- name: Remove stale sysctl overrides
  ansible.builtin.file:
    path: /etc/sysctl.d/{{ item }}
    state: absent
  loop:
    - 20-ipfowarding.conf
    - 99-kubernetes-cri.conf
    - 99-kubernetes.conf
    - 99-zzz-override_cilium.conf
  become: true
  notify: apply sysctl
#
- name: Network hardening sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/20-network-hardening.conf
    content: |
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.log_martians = 1
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv4.ip_forward = 0
      net.ipv6.conf.all.forwarding = 0
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: apply sysctl
#
# 99- so it applies after systemd's 50-default.conf / 50-coredump.conf
- name: Kernel hardening sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kernel-hardening.conf
    content: |
      kernel.kptr_restrict = 2
      kernel.kexec_load_disabled = 1
      kernel.sysrq = 0
      fs.suid_dumpable = 0
      fs.protected_fifos = 2
      fs.protected_regular = 2
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: apply sysctl
#
# ufw applies its own sysctl.conf at start, after systemd-sysctl
- name: Enable martian logging in ufw sysctl
  ansible.builtin.replace:
    path: /etc/ufw/sysctl.conf
    regexp: '^(net/ipv4/conf/(all|default)/log_martians)=0$'
    replace: '\1=1'
  become: true
#
- name: Set zram config
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |
      [zram0]
      zram-size = ram
      compression-algorithm = zstd
    owner: root
    group: root
    mode: "0644"
  become: true
#
- name: Start zram
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0.service
    state: started
    daemon_reload: true
  become: true
