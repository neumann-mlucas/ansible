---
- name: Enable server systemd services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    masked: false
    daemon_reload: true
  loop:
    - jellyfin.service
    - sshd.service
    - pihole-FTL.service
    - glance.service
    - readeck.service
    - taskchampion-sync-server.service
    - yt-jellyfin-sync.timer
