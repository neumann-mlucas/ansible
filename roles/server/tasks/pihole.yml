---
# pi-hole-gravity.timer covers this; cronie is not enabled
- name: Remove weekly gravity cron job
  ansible.builtin.cron:
    name: pihole gravity update
    user: root
    state: absent
  become: true
#
- name: Create pi-hole log directory
  ansible.builtin.file:
    path: /var/log/pihole
    state: directory
    owner: pihole
    group: pihole
    mode: "0755"
  become: true
#
- name: Create pi-hole log files
  ansible.builtin.file:
    path: "/var/log/pihole/{{ item }}"
    state: touch
    owner: pihole
    group: pihole
    mode: "0644"
  loop:
    - pihole.log
    - FTL.log
  become: true
#
- name: Set pi-hole upstream DNS servers
  ansible.builtin.command: pihole-FTL --config dns.upstreams '["1.1.1.1", "8.8.8.8"]'
  become: true
  changed_when: false
#
- name: Read pi-hole config
  ansible.builtin.command: pihole-FTL --config {{ item.key }}
  loop: "{{ pihole_listen | dict2items }}"
  register: pihole_listen_cur
  become: true
  changed_when: false
  check_mode: false
  vars:
    pihole_listen:
      webserver.port: "127.0.0.1:8080,{{ static_ip }}:8080"
      dns.listeningMode: BIND
      dns.interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
      dns.dnssec: "true"
      ntp.sync.active: "false"
#
- name: Apply pi-hole listener, DNSSEC and NTP config
  ansible.builtin.command: pihole-FTL --config {{ item.item.key }} '{{ item.item.value }}'
  loop: "{{ pihole_listen_cur.results }}"
  when: item.stdout | trim != item.item.value
  become: true
  changed_when: true
  notify: restart pihole-FTL
#
- name: Update gravity
  ansible.builtin.command: pihole -g
  become: true
  changed_when: false
