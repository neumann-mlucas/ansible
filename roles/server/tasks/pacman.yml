---
- name: Install server packages with pacman
  community.general.pacman:
    name:
      - jellyfin-server
      - jellyfin-web
    state: present
#
- name: Remove leftover k8s packages
  community.general.pacman:
    name:
      - alacritty
      - crictl
      - kubeadm
      - kubelet
    state: absent
