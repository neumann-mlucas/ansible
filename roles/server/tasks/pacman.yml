---
- name: Install server packages with pacman
  community.general.pacman:
    name:
      - jellyfin-server
      - jellyfin-web
    state: present
#
# dev tooling lives on the desktop only
- name: Remove dev tooling from server
  community.general.pacman:
    name:
      - docker
      - docker-buildx
      - docker-compose
      - go
      - pyright
      - ruff
      - ty
      - uv
      - rust
      - rust-src
      - rust-analyzer
      - cargo-deny
      - cargo-machete
      - cargo-nextest
      - cargo-sweep
      - cargo-update
    state: absent
