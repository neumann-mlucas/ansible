---
- name: Allow DNS traffic for pi-hole (LAN only)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item.proto }}"
    src: "{{ item.src }}"
  loop:
    - { proto: tcp, src: "{{ lan_cidr }}" }
    - { proto: udp, src: "{{ lan_cidr }}" }
  become: true
#
- name: Allow pi-hole web UI
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp
    src: "{{ lan_cidr }}"
  become: true
#
- name: Allow Jellyfin from local network
  community.general.ufw:
    rule: allow
    port: "8096"
    proto: tcp
    src: "{{ lan_cidr }}"
  become: true
#
- name: Allow Jellyfin client discovery (LAN only)
  community.general.ufw:
    rule: allow
    port: "7359"
    proto: udp
    src: "{{ lan_cidr }}"
  become: true
#
- name: Allow binding to LAN IP before network is up
  ansible.builtin.copy:
    dest: /etc/sysctl.d/30-nonlocal-bind.conf
    content: |
      net.ipv4.ip_nonlocal_bind = 1
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: apply sysctl
