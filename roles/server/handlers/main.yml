---
- name: reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: not ansible_check_mode

- name: restart glance
  ansible.builtin.systemd_service:
    name: glance.service
    state: restarted
  become: true
  when: not ansible_check_mode

- name: restart readeck
  ansible.builtin.systemd_service:
    name: readeck.service
    state: restarted
  become: true
  when: not ansible_check_mode

- name: restart jellyfin
  ansible.builtin.systemd_service:
    name: jellyfin.service
    state: restarted
  become: true
  when: not ansible_check_mode

- name: restart pihole-FTL
  ansible.builtin.systemd_service:
    name: pihole-FTL.service
    state: restarted
  become: true
  when: not ansible_check_mode

- name: restart taskchampion-sync-server
  ansible.builtin.systemd_service:
    name: taskchampion-sync-server.service
    state: restarted
  become: true
  when: not ansible_check_mode
